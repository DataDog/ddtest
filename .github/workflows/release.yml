name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Bump the latest published stable release'
        required: true
        type: choice
        default: minor
        options: [patch, minor]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'DataDog/ddtest' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
      GH_REPO: ${{ github.repository }}

    steps:
      # The dispatched commit, even if main advances during the build.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Get GitHub token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/ddtest
          policy: self.github.release.main

      - name: Resolve version and validate release request
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/release.sh validate

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_release_ci.py

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          DDTEST_CLIENT_PUBLIC_TOKEN: ${{ secrets.DDTEST_CLIENT_PUBLIC_TOKEN }}
        run: make release VERSION="$VERSION"

      # The executables report the version, and the install scripts install them
      # from the release's files after checking SHA256SUMS.
      - name: Check the release files
        run: |
          bash .github/scripts/check-release-assets.sh dist
          test "$(dist/ddtest-linux-amd64 --version)" = "$VERSION"
          DDTEST_INSTALL_DOWNLOAD_URL="file://$PWD/dist" bash dist/install.sh --dir "$RUNNER_TEMP/bin"
          cmp dist/ddtest-linux-amd64 "$RUNNER_TEMP/bin/ddtest"
          DDTEST_INSTALL_DOWNLOAD_URL="file://$PWD/dist" pwsh -NoProfile -NonInteractive -File dist/install.ps1 -Dir "$RUNNER_TEMP/bin-pwsh"
          cmp dist/ddtest-linux-amd64 "$RUNNER_TEMP/bin-pwsh/ddtest"

      # go install github.com/DataDog/ddtest@VERSION builds the commit that the
      # release tags: main with ddto's version, required at that version in
      # go.mod. The script checks go install against local tags first.
      - name: Make the release commit
        run: |
          commit=$(bash .github/scripts/release-commit.sh)
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"

      # A rerun may have started or failed while the binaries were building.
      - name: Recheck successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_release_ci.py

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/release.sh create
