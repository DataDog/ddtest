name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (vMAJOR.MINOR.PATCH, for example v1.8.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'DataDog/ddtest' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Get GitHub token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/ddtest
          policy: self.github.release.main

      - name: Validate release request
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/release.sh validate

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make release VERSION="$VERSION"

      # The executables report the version, and the install scripts install them
      # from the release's files after checking SHA256SUMS.
      - name: Check the release files
        run: |
          test "$(dist/ddtest-linux-amd64 --version)" = "$VERSION"
          DDTEST_INSTALL_DOWNLOAD_URL="file://$PWD/dist" bash dist/install.sh --dir "$RUNNER_TEMP/bin"
          cmp dist/ddtest-linux-amd64 "$RUNNER_TEMP/bin/ddtest"
          DDTEST_INSTALL_DOWNLOAD_URL="file://$PWD/dist" pwsh -NoProfile -NonInteractive -File dist/install.ps1 -Dir "$RUNNER_TEMP/bin-pwsh"
          cmp dist/ddtest-linux-amd64 "$RUNNER_TEMP/bin-pwsh/ddtest"

      # go install github.com/DataDog/ddtest@VERSION builds the commit that the
      # release tags: main with ddto's version, required at that version in
      # go.mod. The script checks go install against local tags first.
      - name: Make the release commit
        run: |
          commit=$(bash .github/scripts/release-commit.sh)
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/release.sh create
