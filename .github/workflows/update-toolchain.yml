name: Update Go toolchain

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: update-go-toolchain
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'DataDog/ddtest' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check stable Go and golangci-lint releases
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_toolchain.py

      - name: Get GitHub token
        if: steps.versions.outputs.changed == 'true'
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/ddtest
          policy: self.github.create-pull-requests.toolchain

      - name: Open or update toolchain PR
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: python3 .github/scripts/open_toolchain_pr.py
