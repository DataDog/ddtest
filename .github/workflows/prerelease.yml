name: Pre-Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get GitHub token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/ddtest
          policy: self.github.release.prerelease

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=pre-release-$SHORT_SHA" >> "$GITHUB_ENV"
          make release VERSION="pre-release-$SHORT_SHA"

      # The executables report the version, and the install scripts install them
      # from the release's files after checking SHA256SUMS.
      - name: Check the release files
        run: |
          bash .github/scripts/check-release-assets.sh dist
          test "$(dist/ddtest-linux-amd64 --version)" = "$VERSION"
          DDTEST_INSTALL_DOWNLOAD_URL="file://$PWD/dist" bash dist/install.sh --dir "$RUNNER_TEMP/bin"
          cmp dist/ddtest-linux-amd64 "$RUNNER_TEMP/bin/ddtest"
          DDTEST_INSTALL_DOWNLOAD_URL="file://$PWD/dist" pwsh -NoProfile -NonInteractive -File dist/install.ps1 -Dir "$RUNNER_TEMP/bin-pwsh"
          cmp dist/ddtest-linux-amd64 "$RUNNER_TEMP/bin-pwsh/ddtest"

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          gh release create "pre-release-$SHORT_SHA" \
            --title "Pre-release $SHORT_SHA" \
            --prerelease \
            dist/*
