name: CI

on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATADOG_API_KEY_CONFIGURED: ${{ secrets.DATADOG_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js for project environment regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Yarn for the Plug'n'Play regression fixture
        run: npm install --global yarn@1.22.22

      - name: Set up Ruby for project environment regression tests
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.4"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install Python test dependencies
        run: python -m pip install "ddtrace>=4.11.0" pytest

      - name: Format check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Configure Datadog Test Optimization
        if: ${{ env.DATADOG_API_KEY_CONFIGURED == 'true' }}
        uses: datadog/test-visibility-github-action@1abae93083b69778facd7ee11f89184306c999e6 # v3.2.0
        with:
          languages: go
          # Pin upstream Go 1.27 compatibility fixes until they reach a stable
          # Orchestrion release.
          go-tracer-version: 5df280060f05cbf2863d43748667fcf9cd18c448
          api_key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.com
          service: ddtest

      - name: Run tests
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DD_ENV: ci
          DDTEST_REQUIRE_PROJECT_RUNTIMES: "1"

      - name: Upload coverage report to Datadog
        if: ${{ env.DATADOG_API_KEY_CONFIGURED == 'true' }}
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.com
          files: coverage.out
          format: go-coverprofile
          version: v5.19.0

  rspec-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rspec: "3.12.0"
            datadog_ci: "1.31.0"
          - rspec: "3.13.2"
            datadog_ci: "1.37.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.4"

      - name: Test RSpec adapter
        run: |
          gem install datadog-ci --version "${{ matrix.datadog_ci }}" --no-document
          gem install rspec --version "${{ matrix.rspec }}" --no-document
          DDTEST_RSPEC_VERSION="${{ matrix.rspec }}" \
            DDTEST_DATADOG_CI_VERSION="${{ matrix.datadog_ci }}" \
            go test -v ./internal/compatibility -run '^TestRSpecAdapterIntegration$'
          DDTEST_RUBY_PLATFORM_VERSION="${{ matrix.datadog_ci }}" \
            go test -v ./internal/compatibility -run '^TestRubyPlatformIntegration$'

  minitest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minitest: "5.26.0"
            datadog_ci: "1.31.0"
          - minitest: "6.0.6"
            datadog_ci: "1.37.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.4"

      - name: Test Minitest adapter
        run: |
          gem install datadog-ci --version "${{ matrix.datadog_ci }}" --no-document
          gem install minitest --version "${{ matrix.minitest }}" --no-document
          gem install rake --version "13.2.1" --no-document
          DDTEST_MINITEST_VERSION="${{ matrix.minitest }}" \
            DDTEST_DATADOG_CI_VERSION="${{ matrix.datadog_ci }}" \
            go test -v ./internal/compatibility -run '^TestMinitestAdapterIntegration$'

  pytest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pytest: "8.4.2"
            ddtrace: "4.11.0"
          - pytest: "9.1.1"
            ddtrace: "4.14.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test pytest adapter
        run: |
          python -m pip install "ddtrace==${{ matrix.ddtrace }}" "pytest==${{ matrix.pytest }}"
          DDTEST_PYTHON_BINARY="$(command -v python)" \
            go test -v ./internal/compatibility -run '^TestPyTest(AdapterIntegration|SuiteModeSelectorBatches)$'
          DDTEST_PYTHON_PLATFORM_INTEGRATION=1 \
            go test -v ./internal/compatibility -run '^TestPythonPlatformIntegration$'

  javascript-platform-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dd_trace: ["5.111.0", "6.15.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test JavaScript platform
        run: |
          dd_trace_dir="${RUNNER_TEMP}/dd-trace-${{ matrix.dd_trace }}"
          npm install --prefix "${dd_trace_dir}" "dd-trace@${{ matrix.dd_trace }}"
          DDTEST_DD_TRACE_NODE_MODULES="${dd_trace_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestJavaScript(Platform|ActionPreload)Integration$'

  jest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jest: ["27.5.1", "28.1.3", "29.7.0", "30.5.1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test Jest adapter
        run: |
          jest_dir="${RUNNER_TEMP}/jest-${{ matrix.jest }}"
          npm install --prefix "${jest_dir}" "jest@${{ matrix.jest }}" dd-trace@5.86.0
          DDTEST_JEST_NODE_MODULES="${jest_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestJest(Adapter|Testdrive)Integration$'
          DDTEST_JEST_NODE_MODULES="${jest_dir}/node_modules" \
            go test -v ./internal/testdrive -run '^TestJestCheckOnlyIntegration$'

  vitest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest: ["1.6.1", "2.1.9", "3.2.7", "4.1.11", "5.0.5"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test Vitest adapter
        run: |
          vitest_dir="${RUNNER_TEMP}/vitest-${{ matrix.vitest }}"
          # npm 10.9.8 crashes while resolving Vitest's peer dependencies.
          # Keep peer resolution enabled: Vitest 5 requires Vite as a peer.
          npx --yes npm@11.11.1 install --prefix "${vitest_dir}" "vitest@${{ matrix.vitest }}" "@vitest/coverage-v8@${{ matrix.vitest }}" "dd-trace@5.132.0"
          DDTEST_VITEST_NODE_MODULES="${vitest_dir}/node_modules" \
          DDTEST_DD_TRACE_NODE_MODULES="${vitest_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestVitest(Adapter|Tracing)Integration$'
          DDTEST_VITEST_NODE_MODULES="${vitest_dir}/node_modules" \
            go test -v ./internal/testdrive -run '^TestVitest(Configuration|ValidationArguments|MultiProjectRejectionKeepsConfigurationEvidence)Integration$'

  mocha-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mocha: ["8.4.0", "9.2.2", "10.8.2", "11.7.6", "12.0.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test Mocha adapter
        run: |
          mocha_dir="${RUNNER_TEMP}/mocha-${{ matrix.mocha }}"
          npm install --prefix "${mocha_dir}" "mocha@${{ matrix.mocha }}"
          DDTEST_MOCHA_NODE_MODULES="${mocha_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestMocha.*Integration$'
          DDTEST_MOCHA_NODE_MODULES="${mocha_dir}/node_modules" \
            go test -v ./internal/testdrive -run '^TestMochaNativeObserverIntegration$'

  cypress-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cypress: ["12.17.4", "13.17.0", "14.5.4", "15.21.1", "16.0.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test Cypress adapter
        run: |
          cypress_dir="${RUNNER_TEMP}/cypress-${{ matrix.cypress }}"
          npm install --prefix "${cypress_dir}" "cypress@${{ matrix.cypress }}"
          DDTEST_CYPRESS_BINARY="${cypress_dir}/node_modules/.bin/cypress" \
            DDTEST_CYPRESS_NODE_MODULES="${cypress_dir}/node_modules" \
            DDTEST_CYPRESS_XVFB="$(command -v xvfb-run)" \
            go test -v ./internal/compatibility -run '^TestCypressAdapter.*Integration$'

  playwright-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright: ["1.18.0", "1.31.1", "1.38.0", "1.59.1", "1.60.0", "1.62.1", "1.63.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test Playwright adapter
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          playwright_dir="${RUNNER_TEMP}/playwright-${{ matrix.playwright }}"
          npm install --prefix "${playwright_dir}" "@playwright/test@${{ matrix.playwright }}"
          DDTEST_PLAYWRIGHT_BINARY="${playwright_dir}/node_modules/.bin/playwright" \
            DDTEST_PLAYWRIGHT_NODE_MODULES="${playwright_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestPlaywrightAdapterIntegration$'

  cucumber-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cucumber: ["7.0.0", "8.11.1", "9.6.0", "10.9.0", "11.3.0", "12.9.0", "13.2.1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Test Cucumber adapter
        run: |
          cucumber_dir="${RUNNER_TEMP}/cucumber-${{ matrix.cucumber }}"
          npm install --prefix "${cucumber_dir}" "@cucumber/cucumber@${{ matrix.cucumber }}"
          DDTEST_CUCUMBER_BINARY="${cucumber_dir}/node_modules/.bin/cucumber-js" \
            DDTEST_CUCUMBER_NODE_MODULES="${cucumber_dir}/node_modules" \
            DDTEST_CUCUMBER_VERSION="${{ matrix.cucumber }}" \
            go test -v ./internal/compatibility -run '^TestCucumberAdapterIntegration$'
          DDTEST_CUCUMBER_NODE_MODULES="${cucumber_dir}/node_modules" \
            go test -v ./internal/testdrive -run '^TestCucumberSupportMetadataIntegration$'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v6
        with:
          version-file: .golangci-lint-version
          args: --timeout=5m

  jest-testdrive-workflow:
    name: jest-testdrive-workflow (${{ matrix.node }}, ${{ matrix.jest }}, ${{ matrix.group }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Per runtime: TestPublicJestTestdrive over two shards, plus two groups of
        # configuration tests of similar length; together they are the full set.
        include:
          - {node: '24', jest: '30.5.1', tracer: '6.15.0', typescript: '', group: testdrive, shard: '1/2', tests: 'TestPublicJestTestdrive'}
          - {node: '24', jest: '30.5.1', tracer: '6.15.0', typescript: '', group: testdrive, shard: '2/2', tests: 'TestPublicJestTestdrive'}
          - {node: '24', jest: '30.5.1', tracer: '6.15.0', typescript: '', group: packages, shard: '1/1', tests: 'TestPublicJest(PackageConfiguration|ForwardedConfiguration)'}
          - {node: '24', jest: '30.5.1', tracer: '6.15.0', typescript: '', group: configurations, shard: '1/1', tests: 'TestPublicJest(Configurations|TwoPackageConfiguration|LoaderConfiguration)'}
          - {node: '20', jest: '29.7.0', tracer: '5.132.0', typescript: 'ts-jest@29 typescript@5 @types/jest@29', group: testdrive, shard: '1/2', tests: 'TestPublicJestTestdrive'}
          - {node: '20', jest: '29.7.0', tracer: '5.132.0', typescript: 'ts-jest@29 typescript@5 @types/jest@29', group: testdrive, shard: '2/2', tests: 'TestPublicJestTestdrive'}
          - {node: '20', jest: '29.7.0', tracer: '5.132.0', typescript: 'ts-jest@29 typescript@5 @types/jest@29', group: packages, shard: '1/1', tests: 'TestPublicJest(PackageConfiguration|ForwardedConfiguration)'}
          - {node: '20', jest: '29.7.0', tracer: '5.132.0', typescript: 'ts-jest@29 typescript@5 @types/jest@29', group: configurations, shard: '1/1', tests: 'TestPublicJest(Configurations|TwoPackageConfiguration|LoaderConfiguration)'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install real Jest and tracer
        run: npm install --prefix "${RUNNER_TEMP}/jest-testdrive" jest@${{ matrix.jest }} dd-trace@${{ matrix.tracer }} ${{ matrix.typescript }} typescript@5
      - name: Validate paired outcomes, all feature probes and cleanup
        env:
          DDTEST_JEST_NODE_MODULES: ${{ runner.temp }}/jest-testdrive/node_modules
          DDTEST_TEST_SHARD: ${{ matrix.shard }}
        run: go test -v ./internal/testdrive -run '^(${{ matrix.tests }})$' -count=1 -timeout=12m

  windows-probe-diagnostics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - name: Test Windows probe filesystem diagnostics
        run: go test ./internal/testdrive -run '^(TestProbePublicationExplainsWindowsFilesystemErrors|TestReportsCanReplaceExistingDestinationTwice)$' -count=1


  testdrive-language-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        framework: [pytest, rspec, minitest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.framework == 'pytest'
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        if: matrix.framework != 'pytest'
        with:
          ruby-version: '3.4'
      - name: Run Python or Ruby testdrive
        env:
          DDTEST_RUN_FRAMEWORK_INTEGRATION_TEST: '1'
          DDTEST_FRAMEWORK_REPORTS: ${{ runner.temp }}/ddtest-workflow-reports
        run: go test -v ./internal/testdrive -run '^TestPublicPythonRubyTestdrives/${{ matrix.framework }}$' -count=1 -timeout=20m
      - name: Retain failed testdrive reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testdrive-${{ matrix.framework }}
          path: ${{ runner.temp }}/ddtest-workflow-reports
          if-no-files-found: ignore
          retention-days: 7

  testdrive-vitest-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - vitest: '3.2.7'
            tracer: '5.132.0'
          - vitest: '4.1.11'
            tracer: '6.21.0'
          - vitest: '5.0.5'
            tracer: '6.21.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate Vitest CLI and Node API paths against local intake
        env:
          DDTEST_RUN_FRAMEWORK_INTEGRATION_TEST: '1'
          DDTEST_VITEST_VERSION: ${{ matrix.vitest }}
          DDTEST_VITEST_TRACER_VERSION: ${{ matrix.tracer }}
        run: go test -v ./internal/testdrive -run '^TestPublicVitestRunnerTestdrive$' -count=1 -timeout=15m

  testdrive-mocha-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install Mocha testdrive fixture dependencies
        run: npm install --prefix "$RUNNER_TEMP/mocha-testdrive" mocha@11.7.6 nyc@17.1.0 c8@12.0.0 dd-trace@6.21.0 --no-audit --no-fund
      - name: Validate CLI, programmatic runner, existing failures and coverage gate
        env:
          DDTEST_MOCHA_NODE_MODULES: ${{ runner.temp }}/mocha-testdrive/node_modules
          DDTEST_TEST_SHARD: ${{ matrix.shard }}
        run: go test -v ./internal/testdrive -run '^(TestPublicMochaTestdrive|TestMochaProbeCoverageThresholdControls|TestMochaDelayedCommandUsesSharedTimeout|TestMochaPreflightResolvesSelectedPackage)$' -count=1 -timeout=10m

  testdrive-playwright-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Isolate Playwright fixture caches
        run: |
          echo "npm_config_cache=$RUNNER_TEMP/playwright-testdrive/cache" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-testdrive/browsers" >> "$GITHUB_ENV"
      - name: Install Playwright testdrive fixture dependencies
        run: npm install --prefix "$RUNNER_TEMP/playwright-testdrive" @playwright/test@1.55.1 dd-trace@6.20.1 --no-audit --no-fund
      - name: Install Chromium
        run: "$RUNNER_TEMP/playwright-testdrive/node_modules/.bin/playwright install --with-deps chromium"
      - name: Validate browser execution, existing failures and supervised cleanup
        env:
          DDTEST_PLAYWRIGHT_NODE_MODULES: ${{ runner.temp }}/playwright-testdrive/node_modules
          DDTEST_TEST_SHARD: ${{ matrix.shard }}
        run: go test -v ./internal/testdrive -run '^(TestPublicPlaywrightTestdrive|TestPlaywrightDiscoveryOwnsImportSideEffects)$' -count=1 -timeout=12m

  testdrive-cypress-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Scenarios are split by integration_shard_test.go; each runs exactly once.
        shard: ['1/5', '2/5', '3/5', '4/5', '5/5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install Cypress testdrive fixture dependencies
        env:
          CYPRESS_CACHE_FOLDER: ${{ runner.temp }}/cypress-testdrive-cache
        run: npm install --prefix "$RUNNER_TEMP/cypress-testdrive" cypress@15.1.0 dd-trace@6.20.1 typescript@5.9.3 --save-exact --no-audit --no-fund
      - name: Validate original CLI, action API and matching failures with TIA deferred
        env:
          DDTEST_CYPRESS_NODE_MODULES: ${{ runner.temp }}/cypress-testdrive/node_modules
          CYPRESS_CACHE_FOLDER: ${{ runner.temp }}/cypress-testdrive-cache
          DDTEST_TEST_SHARD: ${{ matrix.shard }}
        run: xvfb-run -a go test -v ./internal/testdrive -run '^(TestPublicCypressTestdrive|TestCypressTypeScriptWrapperTranspilesToCommonJS)$' -failfast -count=1 -timeout=12m

  testdrive-cucumber-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 10.9.0 and 13.3.0 run every scenario across shards; 8.11.1 the floor check.
        include:
          - {cucumber: '8.11.1', shard: '1/1'}
          - {cucumber: '10.9.0', shard: '1/4'}
          - {cucumber: '10.9.0', shard: '2/4'}
          - {cucumber: '10.9.0', shard: '3/4'}
          - {cucumber: '10.9.0', shard: '4/4'}
          - {cucumber: '13.3.0', shard: '1/4'}
          - {cucumber: '13.3.0', shard: '2/4'}
          - {cucumber: '13.3.0', shard: '3/4'}
          - {cucumber: '13.3.0', shard: '4/4'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install Cucumber testdrive fixture dependencies
        run: npm install --prefix "$RUNNER_TEMP/cucumber-testdrive" "@cucumber/cucumber@${{ matrix.cucumber }}" nyc@17.1.0 c8@12.0.0 dd-trace@6.20.1 @istanbuljs/esm-loader-hook@0.3.0 --save-exact --no-audit --no-fund
      - name: Validate native scenarios, matching failures and source coverage
        env:
          DDTEST_CUCUMBER_NODE_MODULES: ${{ runner.temp }}/cucumber-testdrive/node_modules
          DDTEST_TEST_SHARD: ${{ matrix.shard }}
        run: |
          test_filter='^TestPublicCucumberTestdrive$'
          if [ '${{ matrix.cucumber }}' = '8.11.1' ]; then test_filter='^TestPublicCucumberTestdrive/passing$'; fi
          go test -v ./internal/testdrive -run "$test_filter" -failfast -count=1 -timeout=12m

  testdrive-webdriverio-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # npm runs every scenario across shards; pnpm checks its layout on one.
        include:
          - {package-manager: npm, shard: '1/4'}
          - {package-manager: npm, shard: '2/4'}
          - {package-manager: npm, shard: '3/4'}
          - {package-manager: npm, shard: '4/4'}
          - {package-manager: pnpm, shard: '1/1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install WebdriverIO testdrive fixture dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/wdio-testdrive"
          printf '{"private":true}\n' > "$RUNNER_TEMP/wdio-testdrive/package.json"
          if [ '${{ matrix.package-manager }}' = 'pnpm' ]; then
            npm exec --yes --package=pnpm@10.20.0 -- pnpm --dir "$RUNNER_TEMP/wdio-testdrive" add --save-dev --save-exact @wdio/cli@9.20.0 @wdio/local-runner@9.20.0 @wdio/mocha-framework@9.20.0 @wdio/jasmine-framework@9.20.0 @wdio/spec-reporter@9.20.0 dd-trace@6.20.1
          else
            npm install --prefix "$RUNNER_TEMP/wdio-testdrive" @wdio/cli@9.20.0 @wdio/local-runner@9.20.0 @wdio/mocha-framework@9.20.0 @wdio/jasmine-framework@9.20.0 @wdio/spec-reporter@9.20.0 dd-trace@6.20.1 --save-exact --no-audit --no-fund
          fi
      - name: Validate real browser outcomes with Linux Xvfb supervision
        env:
          DDTEST_WEBDRIVERIO_NODE_MODULES: ${{ runner.temp }}/wdio-testdrive/node_modules
          DDTEST_CHROME_BINARY: /usr/bin/google-chrome
          DDTEST_TEST_SHARD: ${{ matrix.shard }}
        run: |
          command -v xvfb-run
          if [ '${{ matrix.package-manager }}' = 'pnpm' ]; then
            go test -v ./internal/testdrive -run '^TestPublicWebdriverIOTestdrive$/^passing$' -failfast -count=1 -timeout=8m
          else
            go test -v ./internal/testdrive -run '^TestPublicWebdriverIOTestdrive$' -failfast -count=1 -timeout=12m
          fi
          if [ '${{ matrix.shard }}' = '1/4' ] || [ '${{ matrix.package-manager }}' = 'pnpm' ]; then
            go test -v ./internal/framework ./internal/testdrive -run '^TestWebdriverIO' -failfast -count=1 -timeout=5m
          fi
