name: CI

on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATADOG_API_KEY_CONFIGURED: ${{ secrets.DATADOG_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.26.5"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-1.26.5-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.5-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install Python test dependencies
        run: python -m pip install "ddtrace>=4.10.3" pytest

      - name: Format check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Configure Datadog Test Optimization
        if: ${{ env.DATADOG_API_KEY_CONFIGURED == 'true' }}
        uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
        with:
          languages: go
          api_key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.com
          service: ddtest

      - name: Run tests
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DD_ENV: ci

      - name: Upload coverage report to Datadog
        if: ${{ env.DATADOG_API_KEY_CONFIGURED == 'true' }}
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.com
          files: coverage.out
          format: go-coverprofile
          version: v5.19.0

  mocha-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mocha: ["8.4.0", "9.2.2", "10.8.2", "11.7.6"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.26.5"

      - name: Test Mocha adapter
        run: |
          mocha_dir="${RUNNER_TEMP}/mocha-${{ matrix.mocha }}"
          npm install --prefix "${mocha_dir}" "mocha@${{ matrix.mocha }}"
          DDTEST_MOCHA_NODE_MODULES="${mocha_dir}/node_modules" \
            go test -v ./internal/framework -run TestMochaAdapterIntegration

  cypress-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cypress: ["12.17.4", "15.16.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.26.5"

      - name: Test Cypress adapter
        run: |
          cypress_dir="${RUNNER_TEMP}/cypress-${{ matrix.cypress }}"
          npm install --prefix "${cypress_dir}" "cypress@${{ matrix.cypress }}"
          DDTEST_CYPRESS_BINARY="${cypress_dir}/node_modules/.bin/cypress" \
            DDTEST_CYPRESS_NODE_MODULES="${cypress_dir}/node_modules" \
            go test -v ./internal/framework -run TestCypressAdapterIntegration

  playwright-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright: ["1.18.0", "1.31.1", "1.38.0", "1.59.1", "1.60.0", "1.62.1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.26.5"

      - name: Test Playwright adapter
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          playwright_dir="${RUNNER_TEMP}/playwright-${{ matrix.playwright }}"
          npm install --prefix "${playwright_dir}" "@playwright/test@${{ matrix.playwright }}"
          DDTEST_PLAYWRIGHT_BINARY="${playwright_dir}/node_modules/.bin/playwright" \
            DDTEST_PLAYWRIGHT_NODE_MODULES="${playwright_dir}/node_modules" \
            go test -v ./internal/framework -run TestPlaywrightAdapterIntegration

  cucumber-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cucumber: ["7.0.0", "10.0.0", "13.2.1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test Cucumber adapter
        run: |
          cucumber_dir="${RUNNER_TEMP}/cucumber-${{ matrix.cucumber }}"
          npm install --prefix "${cucumber_dir}" "@cucumber/cucumber@${{ matrix.cucumber }}"
          DDTEST_CUCUMBER_BINARY="${cucumber_dir}/node_modules/.bin/cucumber-js" \
            DDTEST_CUCUMBER_NODE_MODULES="${cucumber_dir}/node_modules" \
            DDTEST_CUCUMBER_VERSION="${{ matrix.cucumber }}" \
            go test -v ./internal/framework -run TestCucumberAdapterIntegration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "1.26.5"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v6
        with:
          version: v2.11.4
          args: --timeout=5m
