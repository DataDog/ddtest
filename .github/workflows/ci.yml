name: CI

on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATADOG_API_KEY_CONFIGURED: ${{ secrets.DATADOG_API_KEY != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install Python test dependencies
        run: python -m pip install "ddtrace>=4.11.0" pytest

      - name: Format check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Configure Datadog Test Optimization
        if: ${{ env.DATADOG_API_KEY_CONFIGURED == 'true' }}
        uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
        with:
          languages: go
          api_key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.com
          service: ddtest

      - name: Run tests
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DD_ENV: ci

      - name: Upload coverage report to Datadog
        if: ${{ env.DATADOG_API_KEY_CONFIGURED == 'true' }}
        uses: DataDog/coverage-upload-github-action@d9548b1c3c4ab639d5d3ab29a1508af188975f77 # v1.0.5
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          site: datadoghq.com
          files: coverage.out
          format: go-coverprofile
          version: v5.19.0

  rspec-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rspec: "3.12.0"
            datadog_ci: "1.31.0"
          - rspec: "3.13.2"
            datadog_ci: "1.37.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"

      - name: Test RSpec adapter
        run: |
          gem install datadog-ci --version "${{ matrix.datadog_ci }}" --no-document
          gem install rspec --version "${{ matrix.rspec }}" --no-document
          DDTEST_RSPEC_VERSION="${{ matrix.rspec }}" \
            DDTEST_DATADOG_CI_VERSION="${{ matrix.datadog_ci }}" \
            go test -v ./internal/compatibility -run '^TestRSpecAdapterIntegration$'
          DDTEST_RUBY_PLATFORM_VERSION="${{ matrix.datadog_ci }}" \
            go test -v ./internal/compatibility -run '^TestRubyPlatformIntegration$'

  minitest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minitest: "5.26.0"
            datadog_ci: "1.31.0"
          - minitest: "6.0.6"
            datadog_ci: "1.37.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"

      - name: Test Minitest adapter
        run: |
          gem install datadog-ci --version "${{ matrix.datadog_ci }}" --no-document
          gem install minitest --version "${{ matrix.minitest }}" --no-document
          gem install rake --version "13.2.1" --no-document
          DDTEST_MINITEST_VERSION="${{ matrix.minitest }}" \
            DDTEST_DATADOG_CI_VERSION="${{ matrix.datadog_ci }}" \
            go test -v ./internal/compatibility -run '^TestMinitestAdapterIntegration$'

  pytest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pytest: "8.4.2"
            ddtrace: "4.11.0"
          - pytest: "9.1.1"
            ddtrace: "4.14.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test pytest adapter
        run: |
          python -m pip install "ddtrace==${{ matrix.ddtrace }}" "pytest==${{ matrix.pytest }}"
          DDTEST_PYTHON_BINARY="$(command -v python)" \
            go test -v ./internal/compatibility -run '^TestPyTestAdapterIntegration$'
          DDTEST_PYTHON_PLATFORM_INTEGRATION=1 \
            go test -v ./internal/compatibility -run '^TestPythonPlatformIntegration$'

  javascript-platform-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dd_trace: ["5.111.0", "6.15.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test JavaScript platform
        run: |
          dd_trace_dir="${RUNNER_TEMP}/dd-trace-${{ matrix.dd_trace }}"
          npm install --prefix "${dd_trace_dir}" "dd-trace@${{ matrix.dd_trace }}"
          DDTEST_DD_TRACE_NODE_MODULES="${dd_trace_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestJavaScriptPlatformIntegration$'

  jest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jest: ["27.5.1", "28.1.3", "29.7.0", "30.5.1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test Jest adapter
        run: |
          jest_dir="${RUNNER_TEMP}/jest-${{ matrix.jest }}"
          npm install --prefix "${jest_dir}" "jest@${{ matrix.jest }}"
          DDTEST_JEST_NODE_MODULES="${jest_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestJest(Adapter|ConfigurationParity|GeneratedDiscoveryParity)Integration$'

  jest-open-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dayjs
            repository: iamkun/dayjs
            revision: 93c8fd0f807b8a8252f4cd65083bb1d6a49b90e7 # v1.11.13
          - project: immer
            repository: immerjs/immer
            revision: e2d222bd4fb26abded04075c936290715e9ee335 # v10.1.1
          - project: redux
            repository: reduxjs/redux
            revision: f4b3ab9ac5370c5520d08383c5fc88e1e1c64587 # v4.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: .integration/jest-project
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install locked upstream dependencies
        working-directory: .integration/jest-project
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          if [ "$PROJECT" = immer ]; then
            npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts --non-interactive
          else
            npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          fi
          if [ "$PROJECT" = redux ]; then
            npm run build
          fi
      - name: Verify original suites and DDTest file skipping
        env:
          DDTEST_JEST_PROJECT: ${{ matrix.project }}
          DDTEST_JEST_PROJECT_ROOT: ${{ github.workspace }}/.integration/jest-project
        run: go test -v ./internal/planner -run '^TestJestOpenSourceProjectIntegration$' -count=1

  vitest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest: ["1.6.1", "2.1.9", "3.2.7", "4.1.11", "5.0.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test Vitest adapter
        run: |
          vitest_dir="${RUNNER_TEMP}/vitest-${{ matrix.vitest }}"
          # npm 10.9.8 crashes while resolving Vitest's peer dependencies.
          # Keep peer resolution enabled: Vitest 5 requires Vite as a peer.
          npx --yes npm@11.11.1 install --prefix "${vitest_dir}" "vitest@${{ matrix.vitest }}"
          DDTEST_VITEST_NODE_MODULES="${vitest_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestVitest(Fast)?AdapterIntegration$'

  mocha-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mocha: ["8.4.0", "9.2.2", "10.8.2", "11.7.6", "12.0.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test Mocha adapter
        run: |
          mocha_dir="${RUNNER_TEMP}/mocha-${{ matrix.mocha }}"
          npm install --prefix "${mocha_dir}" "mocha@${{ matrix.mocha }}"
          DDTEST_MOCHA_NODE_MODULES="${mocha_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestMochaAdapter.*Integration$'

  cypress-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cypress: ["12.17.4", "13.17.0", "14.5.4", "15.21.1", "16.0.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test Cypress adapter
        run: |
          cypress_dir="${RUNNER_TEMP}/cypress-${{ matrix.cypress }}"
          npm install --prefix "${cypress_dir}" "cypress@${{ matrix.cypress }}" typescript@5.9.3
          DDTEST_CYPRESS_BINARY="${cypress_dir}/node_modules/.bin/cypress" \
            DDTEST_CYPRESS_NODE_MODULES="${cypress_dir}/node_modules" \
            DDTEST_CYPRESS_XVFB="$(command -v xvfb-run)" \
            go test -v ./internal/compatibility -run '^TestCypress(Fast)?Adapter.*Integration$'

  playwright-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright: ["1.18.0", "1.31.1", "1.38.0", "1.59.1", "1.60.0", "1.62.1", "1.63.0"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test Playwright adapter
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          playwright_dir="${RUNNER_TEMP}/playwright-${{ matrix.playwright }}"
          npm install --prefix "${playwright_dir}" "@playwright/test@${{ matrix.playwright }}"
          DDTEST_PLAYWRIGHT_BINARY="${playwright_dir}/node_modules/.bin/playwright" \
            DDTEST_PLAYWRIGHT_NODE_MODULES="${playwright_dir}/node_modules" \
            go test -v ./internal/compatibility -run '^TestPlaywright(Fast)?AdapterIntegration$'

  cucumber-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cucumber: ["7.0.0", "8.11.1", "9.6.0", "10.9.0", "11.3.0", "12.9.0", "13.2.1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test Cucumber adapter
        run: |
          cucumber_dir="${RUNNER_TEMP}/cucumber-${{ matrix.cucumber }}"
          npm install --prefix "${cucumber_dir}" "@cucumber/cucumber@${{ matrix.cucumber }}"
          DDTEST_CUCUMBER_BINARY="${cucumber_dir}/node_modules/.bin/cucumber-js" \
            DDTEST_CUCUMBER_NODE_MODULES="${cucumber_dir}/node_modules" \
            DDTEST_CUCUMBER_VERSION="${{ matrix.cucumber }}" \
            go test -v ./internal/compatibility -run '^TestCucumber(Fast)?AdapterIntegration$'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v6
        with:
          version-file: .golangci-lint-version
          args: --timeout=5m
