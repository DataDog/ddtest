name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GORACE: atexit_sleep_ms=0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.plan.outputs.go }}
      ddto: ${{ steps.plan.outputs.ddto }}
      evaluator: ${{ steps.plan.outputs.evaluator }}
      integrations: ${{ steps.plan.outputs.integrations }}
      playwright: ${{ steps.plan.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/ci_test_plan.py plan --base "$BASE" \
            --output "$RUNNER_TEMP/plan.json" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-test-plan
          path: ${{ runner.temp }}/plan.json

  unit:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.4'
      - name: Install runtime-backed unit test prerequisites
        run: |
          npm install --global yarn@1.22.22
          python -m pip install "ddtrace>=4.11.0" pytest pytest-cov pytest-xdist
      - name: Test affected Go packages and their dependents
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DDTEST_REQUIRE_PROJECT_RUNTIMES: '1'
        run: python3 scripts/ci_test_plan.py run --base "$BASE" --race

  scripts:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        if: needs.plan.outputs.evaluator == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.plan.outputs.evaluator == 'true'
        with:
          node-version: '22'
      - name: Install evaluator package-manager fixtures
        if: needs.plan.outputs.evaluator == 'true'
        run: npm install --global yarn@1.22.22 pnpm@12.14.0
      - name: Test CI and install scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test changed onboarding evaluator
        if: needs.plan.outputs.evaluator == 'true'
        run: python3 -m unittest discover -s skills/ddtest-onboarding-eval/scripts -p 'test_*.py'

  instrument:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - name: Build release instrumentation and run its smoke packages
        env:
          DD_CIVISIBILITY_ENABLED: 'false'
        run: |
          go -C ddto run ./scripts/release -main .. -name ddtest -command instrument \
            -version v0.0.0-pr -target linux/amd64 -o "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/dist/ddtest-linux-amd64" instrument go test -race ./internal/buildinfo ./internal/errcode

  instrumentation-unit:
    needs: plan
    if: needs.plan.outputs.ddto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ddto/go.mod
      - name: Audit and test instrumentation units on the current toolchain
        working-directory: ddto
        run: |
          python3 scripts/upstream.py verify
          python3 scripts/dependency_boundary.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          go vet ./...
          packages=$(go list ./... | grep -v '/integration$')
          go test -short -race $packages

  integration:
    needs: plan
    if: needs.plan.outputs.integrations != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.plan.outputs.integrations) }}
    name: smoke (${{ matrix.configuration.id }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.configuration.runtime == 'node'
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.configuration.runtime == 'python'
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        if: matrix.configuration.runtime == 'ruby'
        with:
          ruby-version: '3.4'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.configuration.runtime == 'java' || matrix.configuration.runtime == 'gradle'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.configuration.runtime == 'gradle'
        with:
          gradle-version: '8.10.2'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: matrix.configuration.runtime == 'node'
        with:
          path: |
            ~/.npm
            ~/.cache/Cypress
          key: smoke-${{ runner.os }}-${{ matrix.configuration.id }}-${{ hashFiles('scripts/ci_test_plan.json') }}
          restore-keys: smoke-${{ runner.os }}-${{ matrix.configuration.id }}-
      - name: Run selected smoke and require every named scenario
        run: python3 scripts/ci_smoke.py --id '${{ matrix.configuration.id }}'

  playwright:
    needs: plan
    if: needs.plan.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 scripts/ci_smoke.py --id playwright

  evaluator-isolation:
    needs: plan
    if: needs.plan.outputs.evaluator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build offline evaluator image
        run: |
          scripts=skills/ddtest-onboarding-eval/scripts
          docker build --target offline -t ddtest-eval-offline -f "$scripts/Dockerfile" "$scripts"
          echo "DDTEST_EVAL_TEST_IMAGE=$(docker image inspect --format '{{.Id}}' ddtest-eval-offline)" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s skills/ddtest-onboarding-eval/scripts -p test_container.py -v

  lint:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(git ls-files -z '*.go' ':!:ddto/**' | xargs -0 gofmt -s -l)"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v6
        with:
          version-file: .golangci-lint-version
          args: --timeout=5m

  # Preserve the required check name and reject every failed or unexpectedly
  # skipped selected job. Only the planner may intentionally omit a check.
  test:
    if: ${{ always() }}
    needs: [plan, unit, scripts, instrument, instrumentation-unit, integration, playwright, evaluator-isolation, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['plan']['result'] != 'success':
              raise SystemExit('Test selection failed')
          plan = results['plan']['outputs']
          required = {'plan', 'scripts'}
          if plan['go'] == 'true':
              required.update(['unit', 'instrument', 'lint'])
          if plan['ddto'] == 'true':
              required.add('instrumentation-unit')
          if plan['evaluator'] == 'true':
              required.add('evaluator-isolation')
          if json.loads(plan['integrations']):
              required.add('integration')
          if plan['playwright'] == 'true':
              required.add('playwright')
          bad = {name: job['result'] for name, job in results.items()
                 if job['result'] != ('success' if name in required else 'skipped')}
          if bad:
              raise SystemExit(f'Selected checks incomplete: {bad}')
          PY
