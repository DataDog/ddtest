# Trimmed from weshatheleopard/rubyXL (MIT), .circleci/config.yml: comments
# and the JUnit formatter (with its output directory), which needs a gem this
# fixture does not bundle, removed.
version: 2.1

jobs:
  build:
    parameters:
      ruby-version:
        type: string
    docker:
      - image: cimg/ruby:<< parameters.ruby-version >>

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: install dependencies
          command: |
            gem install bundler
            bundle install --jobs=4 --retry=3

      - run:
          name: run tests
          command: |
            TEST_FILES="$(circleci tests glob "spec/**/*_spec.rb" | \
              circleci tests split --split-by=timings)"

            bundle exec rspec \
              --format progress \
              $TEST_FILES

      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

workflows:
  test:
    jobs:
      - build:
          matrix:
            parameters:
              ruby-version: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
