# patkennedy79/flask_user_management_example@268ff578 (BSD-2-Clause), .gitlab-ci.yml,
# unchanged; the repository is a plain pytest project instead of the Flask
# application.
# Tagged releases of Python docker images can be found at:
# https://hub.docker.com/r/library/python/tags/
image: python:3.12

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python --version  # Print out python version for debugging
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install -r requirements.txt
  - pip install --upgrade setuptools  # Fix security vulnerability in <=65.5.0

stages:
  - Static Analysis
  - Security
  - Test

flake8:
  stage: Static Analysis
  script:
  - python -m flake8 --max-line-length=150 --max-complexity 5 *.py project/*.py project/*/routes.py

isort:
  stage: Static Analysis
  script:
  - python -m isort . --lines-after-imports 2 --check-only

bandit:
  stage: Security
  script:
    - bandit project/__init__.py
    - bandit project/models.py
    - bandit project/*/*.py

safety:
  stage: Security
  script:
  - safety check

pytest:
  stage: Test
  script:
  - python -m pytest

coverage:
  stage: Test
  script:
  - python -m pytest --cov-report term-missing --cov=project
  coverage: '/^TOTAL.+?(\d+\%)$/'
