    optional_speed:
      reason: keep 5 Cypress specs (network_requests.cy.js also needs internet)
      commands:
      - sh -c 'cd cypress/e2e/2-advanced-examples && for f in *.cy.js; do case $f in aliasing.cy.js|location.cy.js|querying.cy.js|window.cy.js)
        ;; *) git rm -q $f;; esac; done'
  ci_test_command: npm run start & ; npm run e2e:record -- --parallel --group "electrons on GitLab CI" (cypress
    run --record --parallel)
  local_test_command: CI=1 npm run test:ci (run-p --race start e2e)
  timings_seconds:
    clone: 1.8
    install: 2.6
    browser: 11.9
    build: 0
    tests_full: 64
    tests_trimmed: 11.8
  tests:
    full: 20 specs, 122 tests, all pass (Cypress-reported 49s)
    trimmed: 5 specs (todo + aliasing/location/querying/window), 19 tests pass
  sizes:
    repo: .git 7.9M, 117 files
    deps: node_modules 94M + Cypress cache 683M
  prepared_image:
    bake: node_modules + Cypress binary cache (CYPRESS_CACHE_FOLDER outside the checkout; verified once). No dd-trace,
      no coverage setup.
    keep_out: dd-trace and any coverage setup (babel-plugin-istanbul, @cypress/code-coverage)
  notes:
  - 'HEAD cd24a0a (Cypress 16.2.1) and 16.0.0/16.1.1 fail on the bookworm browsers image: addon-native.node needs
    GLIBCXX_3.4.32. Pinned the last Cypress 15 commit.'
  - 'Repo carries CI for many systems: .gitlab-ci.yml, .buildkite/pipeline.yml, Jenkinsfile (docker cypress/base,
    record keys), .circleci (release only), 9 GitHub workflows, plus Semaphore/Travis/Azure/Buddy/CodeBuild/Amplify.
    ci_provider answer selects GitLab.'
  - ddtest's cypress_observer strips --record/--parallel; kitchensink is already a ddtest detection fixture.
  - Repo ships AGENTS.md and CLAUDE.md, which the tested agent will read.
  risks:
  - Record mode with CI-only CYPRESS_RECORD_KEY; background `npm run start &` in the job.
  - network_requests.cy.js needs internet (trimmed out).
  - Cypress TIA (skipping/coverage) is deferred in ddtest; expect those controls as deferred.
  expected:
    verdict: INCOMPLETE
    blockers:  # verified: rerun4 and eval-claude-2026-11-04 testdrive.json (the configuration line is derived)
    - Cypress real-suite coverage was not observed
    run: eval-claude-2026-11-04
    ddtest: b7a9d2ba
    reason: 122/122 and features 6/6, Node 24 read from the cypress/base:24.19.0 tag (no ci_runtime question); the only
      blocker is application coverage, which needs approval for a test-only babel-plugin-istanbul
- id: E09-lux-design-system
  framework: playwright
  language: javascript
  ci_provider: circleci
  ci_config_path: .circleci/config.yml
  repo: https://github.com/pulibrary/lux-design-system.git
  commit: 13da14345b8fad2639a79186e04fbac46d58b2ee
  commit_date: '2026-11-03'
  subdir: null
  image: browsers
  runtime:
    project: .tool-versions nodejs 24.19.0, npm 12.0.2
    ci: 'job playwright: mcr.microsoft.com/playwright:v1.62.1-noble (Node 24 per its Dockerfile), orb circleci/node@5.0.2
      install-packages'
    local: node 24.19.0, npm 11.17.0
    package_manager: npm (package-lock.json)
    framework_version: '@playwright/test 1.62.1'
  system_needs:
  - 'WebKit host libs (libgstreamer-1.0, libgtk-4, libgraphene, gst allocators...) absent from bookworm image: webkit
    project cannot launch'
  browsers: Playwright chromium-1234 + headless shell (984M) and firefox-1538 via `npx playwright install chromium
    firefox` into PLAYWRIGHT_BROWSERS_PATH
  services: null
  setup_commands:
  - npm ci --no-audit --no-fund
  - npx playwright install chromium firefox
  readiness_commands: []
  harness:
    framework: playwright
    python: null
    pnpm: null
    bundle_binstubs: []
    answers:
    - ci_runtime=node=24
  trims:
    required:
      reason: 'the webkit project cannot launch: its host libraries are missing on bookworm'
      commands:
      - 'perl -0pi -e ''s/\n    \{\n      name: "webkit",\n      use: \{ \.\.\.devices\["Desktop Safari"\] \},\n    \},\n//''
        playwright.config.js'
      - sh -c '! grep -n webkit playwright.config.js'
    optional_speed:
      reason: drop the Wikipedia-backed spec (passes with network access)
      commands:
      - git rm -q end2end/singleselectasync.spec.js
  ci_test_command: npx playwright test
  local_test_command: CI=1 npx playwright test
  timings_seconds:
    clone: 8.6
    install: 9.0
    browser: 27.5
    build: 0
    tests_full: 22
    tests_trimmed: 13
  tests:
    full: '3 specs x 3 projects: 6 passed (chromium, firefox), 3 failed (webkit cannot launch)'
    trimmed: 2 specs x 2 projects (chromium, firefox) = 4 passed
  sizes:
    repo: .git 12M, 227 files
    deps: node_modules 589M + browsers ~1.3G (chromium+firefox)
  prepared_image:
    bake: 'node_modules + Playwright browsers (chromium, headless shell, firefox) in PLAYWRIGHT_BROWSERS_PATH outside
      the checkout. Do not prebuild dist/: the webServer runs `npm run build` (vite) each time, which is part of
      the suite.'
    keep_out: 'dist/: the webServer runs the vite build on each run, as part of the suite'
  notes:
  - 'webServer: `npm run start` = vite build + npx http-server :5002 (build ~5s per run).'
  - Also has a vitest suite (node/test orb matrix 24.19.0/22.16.0), styleguide and package jobs; no GitHub workflows.
  - 'Alternative to trimming webkit: a derived image with `npx playwright install-deps webkit` (root at build time).'
  risks:
  - 'CI image name selects no Node version; if ddtest asks, answer ci_runtime=node=24 (mcr playwright v1.62.1 Dockerfile:
    NODE_VERSION=24).'
  - Example pages may load Vue from unpkg.com (internet).
  - 'HEAD of an active repo: pin the SHA.'
  expected:
    verdict: COMPLETE LOCALLY
    run: eval-claude-2026-11-04
    ddtest: b7a9d2ba
    reason: with the WebKit trim; ci_runtime=node=24 answers the question the mcr Playwright image raises
