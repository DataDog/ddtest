# ddtest onboarding eval: standard case catalog. Edit cases here; run them with
# scripts/run_catalog.py (see "Case catalog" in SKILL.md).
#
# One pinned open-source case per supported framework, every CI provider
# covered. Selected and measured in round 2026-11-03.
#
# Harness order per case (run_eval.py):
#   clone at `commit`
#   -> trims.required (then trims.optional_speed with --speed-trims), each
#      committed by run_catalog.py with a scratch identity so `git status` stays clean
#   -> setup_commands -> readiness_commands -> agent.
# Commands use run_eval.py's shlex form: no implicit shell, `sh -c` where one is
# needed. Trim commands only edit or `git rm`; run_catalog.py adds the commit.
# /tmp in a command is the container's private tmpfs, not the host's.
#
# Fields:
#   id                 E<nn>-<name>, unique.
#   framework          run_eval.py --framework value; exactly one case each.
#   language, ci_provider (github, gitlab, circleci, buildkite, jenkins),
#   ci_config_path     the CI file ddtest should onboard.
#   repo, commit       public clone URL and full 40-hex commit (never a branch).
#   commit_date, subdir  subdir: the package directory when not the root.
#   image              key of `images` below: the Dockerfile target and build args.
#   runtime            project / ci / local runtime, package manager and framework version.
#   system_needs, browsers, services  what the suite needs beyond the image.
#   setup_commands, readiness_commands  run_eval.py --setup-command / --readiness-command.
#   harness            run_eval.py flags: framework, python, pnpm, bundle_binstubs,
#                      answers (--user-answer values).
#   trims.required     {reason, commands}: needed for the suite to pass at all
#                      on the image; always applied.
#   trims.optional_speed  {reason, commands}: catalog speed trims, only with --speed-trims.
#   ci_test_command, local_test_command  what CI runs and its local equivalent.
#   timings_seconds    measured outside any agent, in throwaway containers on a
#                      linux/arm64 Colima VM (4 CPU, 8 GB, shared), on the container
#                      filesystem: the harness's /trial bind mount is ~1.2-1.4x slower
#                      and network-bound steps vary 1.5-2x. install = dependency
#                      install (Java: wrapper + dependency resolution); browser =
#                      browser/binary download; build = compile beyond the test command;
#                      tests_full = one untrimmed CI-equivalent run with warm caches;
#                      tests_trimmed = the same with every listed trim (null: no trim).
#                      ddtest normally runs the real suite twice per configuration,
#                      then selects controlled probes for feature checks.
#   tests              test counts, full and trimmed.
#   sizes              repository and dependency sizes.
#   prepared_image     what a prepared image or snapshot would bake, and what to keep
#                      out. Optional warmup_commands prepare dependency caches in a
#                      throwaway copy; they never replace trial setup/readiness.
#                      Every case keeps out tracers, CI edits, .testoptimization
#                      and build outputs, so ddtest still has real work to do.
#   notes, risks
#   expected           checked by run_catalog.py after every trial (see "Case catalog"
#                      in SKILL.md): a mismatch fails the batch.
#     verdict          COMPLETE LOCALLY | PASSED | INCOMPLETE | FAILED: the
#                      testdrive.json summary.status a correct trial reaches.
#     reason           why; required for every verdict but COMPLETE LOCALLY.
#     blockers         optional, INCOMPLETE/FAILED only: the blockers the verdict may
#                      have. Each is a blocker identifier (catalog_check.blocker_id of a
#                      summary.blocking_checks entry, such as "feature skipping:
#                      inconclusive", "compatibility: suspected regression",
#                      "runtime fidelity: substitute Java", "unresolved CI scope:
#                      <file> / <job> / step <n>: <cause class>" or a headline like
#                      "Cypress real-suite coverage was not observed"); fnmatch patterns
#                      ("feature *: inconclusive") are allowed, but prefer exact
#                      identifiers, which a new blocker can't match (write a literal
#                      "[" as "[[]"). Any other blocker fails
#                      the case; "configuration: <status>" and "not every project has
#                      every required feature result" only restate others and count
#                      only alone. Without blockers only the verdict is checked.
#     run, ddtest      provenance: the run (an output folder or round, such as
#                      eval-claude-2026-11-04) and the ddtest build (its commit, as
#                      passed with --ddtest-label) the expectation was observed on.
#     agents           optional per-agent overrides, {codex|claude: {verdict,
#                      blockers, reason, run, ddtest}}, applied over the shared
#                      fields for that agent only. ddtest decides the verdict, so
#                      use one only for a known agent difference; a verdict
#                      override needs its own reason.
schema_version: 1
round: '2026-11-03'

# Image keys used by cases. Build each from scripts/Dockerfile:
#   docker build --target <target> [--build-arg K=V ...] -t <tag> \
#     -f skills/ddtest-onboarding-eval/scripts/Dockerfile skills/ddtest-onboarding-eval/scripts
# and pass the image to run_catalog.py as --image-map <key>=<image>.
images:
  agents:
    target: agents
    build_args: {}
    provides: Node 24.19.0, npm 11.17.0, pnpm 12.14.0, yarn 1.22.22 (Debian bookworm)
  browsers:
    target: browsers
    build_args: {}
    provides: agents + Debian Chromium and chromedriver, Xvfb, CHROMEDRIVER_PATH
  python:
    target: python
    build_args: {}
    provides: agents + CPython 3.12 with venv (/usr/local/bin/python3)
  ruby:
    target: ruby
    build_args: {}
    provides: agents + Ruby 3.4.12, Bundler 2.6.9
  java21:
    target: java
    build_args: {}
    provides: agents + Temurin 21, Maven 3.9.11
  java17:
    target: java
    build_args:
      JDK_IMAGE: eclipse-temurin:17-jdk@sha256:91011320978c10ec51d2cde1eb6f616db6d2a739a0e521096c343dd3fed9abe6
    provides: agents + Temurin 17, Maven 3.9.11

