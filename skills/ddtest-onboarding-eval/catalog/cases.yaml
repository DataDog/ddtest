    optional_speed: null
  ci_test_command: TESTFILES=$(circleci tests glob ... | circleci tests split --split-by=timings); JEST_JUNIT_OUTPUT=...
    npm run test -- --runInBand ${TESTFILES}
  local_test_command: NODE_ENV=test npx jest --runInBand
  timings_seconds:
    clone: 2.0
    install: 20.6
    browser: 0
    build: 0
    tests_full: 6.8
    tests_trimmed: null
  tests:
    full: 18 suites / 138 tests, all pass
    trimmed: null
  sizes:
    repo: .git 2.3M, tree 1.3M, 91 files
    deps: node_modules 293M
  prepared_image:
    bake: node_modules (gitignored) + npm cache; nothing else. Leave dd-trace uninstalled and package.json/CI untouched.
    keep_out: dd-trace; package.json and the CI file stay untouched
