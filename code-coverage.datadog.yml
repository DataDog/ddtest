schema-version: v1
ignore:
  # ddto's incorporated upstream sources (dd-trace-go, msgp, fwd, x/sys), like
  # vendored code: their manifests pin them to upstream, whose tests they keep
  # (see ddto/internal/thirdparty/README.md).
  - "ddto/internal/thirdparty/"
  # Code that tinylib/msgp generates for ddto's events: most of it is the error
  # branch after each read or write, which encoding into memory never takes.
  - "ddto/**/*_msgp.go"
  # ddto's tools, test helpers, fixtures and archived records, which ddtest
  # does not ship.
  - "ddto/docs/"
  - "ddto/integration/"
  - "ddto/internal/testassert/"
  - "ddto/scripts/"
  - "ddto/testdata/"
