name: Compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    name: differential (${{ matrix.os }}, ${{ matrix.go }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.26.x'
            mode: normal
          - os: ubuntu-latest
            go: '1.26.x'
            mode: race
          - os: ubuntu-latest
            go: '1.27.x'
            mode: normal
          - os: ubuntu-latest
            go: '1.27.x'
            mode: race
          - os: macos-latest
            go: '1.27.x'
            mode: normal
          - os: windows-latest
            go: '1.27.x'
            mode: normal
    runs-on: ${{ matrix.os }}
    # Each job runs one complete suite; Linux normal/race jobs run independently.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: testdata/fixture/go.sum
      - name: Install frozen Orchestrion reference
        shell: bash
        run: |
          go install github.com/DataDog/orchestrion@v1.13.2-0.20260917114356-5c24783fcd76
          reference="$(go env GOPATH)/bin/orchestrion"
          if [[ "$RUNNER_OS" == "Windows" ]]; then reference="$reference.exe"; fi
          echo "ORCHESTRION_BIN=$reference" >> "$GITHUB_ENV"
      - name: Verify incorporated sources and licenses
        shell: bash
        run: |
          python scripts/upstream.py verify
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify modules and driver dependency boundary
        shell: bash
        run: |
          (cd testdata/fixture && go mod download && go mod verify)
          go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/ddtest
          go vet ./...
      - name: Unit, runtime and differential compatibility
        shell: bash
        env:
          PARITY_EXECUTION_ORDER: ${{ matrix.mode == 'race' && 'mini-first' || 'sdk-first' }}
          PARITY_REPORT_NAME: ${{ matrix.mode == 'race' && 'parity-race' || 'parity' }}
          PARITY_TEST_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p artifacts
          set -o pipefail
          test_flags=()
          if [[ "$PARITY_TEST_MODE" == "race" ]]; then test_flags+=(-race); fi
          PARITY_REPORT_PATH="$PWD/artifacts/$PARITY_REPORT_NAME.json" go test "${test_flags[@]}" -v -count=1 -timeout=20m ./... 2>&1 | tee artifacts/compatibility.log
      - name: Publish CI feature parity evidence
        shell: bash
        env:
          PARITY_REPORT_NAME: ${{ matrix.mode == 'race' && 'parity-race' || 'parity' }}
        run: |
          python scripts/parity_report.py "artifacts/$PARITY_REPORT_NAME.json" --output "artifacts/$PARITY_REPORT_NAME.md"
          cat "artifacts/$PARITY_REPORT_NAME.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-go-${{ matrix.go }}-${{ matrix.mode }}
          path: artifacts/
          retention-days: 7
