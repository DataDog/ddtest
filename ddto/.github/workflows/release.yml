name: Release
# Run it from main with a version, such as v0.1.0 or v0.1.0-rc.1. It commits
# that version to internal/version in a commit that only the new tag points to,
# so that go install at the tag reports it too; builds and checks the
# executables; then pushes the tag and publishes the release with the
# executables, install.sh, install.ps1 and SHA256SUMS. After a release without
# a prerelease suffix, a second job opens a pull request that sets main's
# version to the release's with a -dev suffix, such as 0.1.0-dev; rerunning
# that job alone retries it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.1.0 or v0.1.0-rc.1
        required: true
permissions:
  contents: read
concurrency:
  group: release
env:
  PYTHONDONTWRITEBYTECODE: '1'
  VERSION: ${{ inputs.version }}
jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      base: ${{ steps.commit.outputs.base }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::run the release workflow from main"
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # v6.4.0: on 2026-10-15 GitHub answered 404 for the archives of v6.5.0 and
      # v7.0.0 by commit, which job setup downloads.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.x'
          cache: false
      # scripts/release rejects a version that is not vMAJOR.MINOR.PATCH with
      # an optional prerelease.
      - name: Commit and tag the version
        id: commit
        shell: bash
        run: |
          go run ./scripts/release -version "$VERSION" -stamp
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -am "Release $VERSION"
          git tag "$VERSION"
      - name: Build
        shell: bash
        run: |
          go run ./scripts/release -o dist
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist && sha256sum ddto-* install.sh install.ps1 > SHA256SUMS
      - name: Check the executables and the install scripts
        shell: bash
        run: |
          test "$(dist/ddto-linux-amd64 --version)" = "ddto $VERSION"
          DDTO_DOWNLOAD_URL="file://$PWD/dist" bash dist/install.sh --dir "$RUNNER_TEMP/bin"
          cmp dist/ddto-linux-amd64 "$RUNNER_TEMP/bin/ddto"
          DDTO_DOWNLOAD_URL="file://$PWD/dist" pwsh -NoProfile -NonInteractive -File dist/install.ps1 -Dir "$RUNNER_TEMP/bin-pwsh"
          cmp dist/ddto-linux-amd64 "$RUNNER_TEMP/bin-pwsh/ddto"
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin "refs/tags/$VERSION"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION" dist/* --verify-tag --title "$VERSION" --generate-notes "${flags[@]}"

  dev-version:
    name: Propose ${{ inputs.version }}-dev
    needs: release
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release.outputs.base }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.x'
          cache: false
      # GitHub asks a user with write access to approve the workflows of a
      # pull request that a workflow opens; the pull request says so.
      - name: Open the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="dev-version/$VERSION"
          # A rerun reuses the branch as it is, with any commits added to it.
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            go run ./scripts/release -version "$VERSION-dev" -stamp
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -q -am "Start ${VERSION#v}-dev after $VERSION"
            git push -q origin "HEAD:refs/heads/$branch"
          fi
          if ! gh pr view "$branch" --json number > /dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "Start ${VERSION#v}-dev after $VERSION" \
              --body "Builds from main report the last release, $VERSION, with a -dev suffix. Approve this pull request's workflows to run CI on it."
          fi
